# ⚠⚠ NOT APPLIED. Do not apply until the three Secret Manager secrets exist and
# the IAM binding covers them — see README-ALL-USERS.md.
#
# The CSI driver fails the MOUNT when a declared secret cannot be fetched, and a
# failed mount leaves the pod stuck in ContainerCreating. Applying this before
# the secrets exist would take the pooler down — the same outage class as #311,
# arrived at from the other direction.
#
# This is a SECOND SecretProviderClass rather than an edit to the live one, so
# the switch is an explicit, reversible one-line change to the Deployment's
# volume reference rather than a mutation of the object prod depends on.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pgbouncer-db-secrets-all
  namespace: postgres
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-postgres-password/versions/latest"
        path: "postgres-password"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-demo-password/versions/latest"
        path: "demo-password"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-auth-password/versions/latest"
        path: "auth-password"
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-superuser-password/versions/latest"
        path: "superuser-password"
