# Secret Manager -> CSI mount for pgbouncer (noetl/ai-meta#311).
#
# The `postgres` namespace has no SecretProviderClass today; this is the first.
# Same provider (`gke`) and the same secret the control plane already mounts, so
# the value pgbouncer sees is by construction the one the server uses.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pgbouncer-db-secrets
  namespace: postgres
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/shastaratech-noetl-prod/secrets/noetl-postgres-password/versions/latest"
        path: "postgres-password"
